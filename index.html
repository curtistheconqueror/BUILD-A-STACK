<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Build-a-Stack · learn how systems connect</title>
<style>
  :root{--bg0:#05080f;--bg1:#0a1020;--ink:#eaf1ff;--muted:#8ea0c4;--acc:#35d0e0;--acc2:#b78cff;--acc3:#ff6fb5;
    --ok:#51e08a;--bad:#ff5d6c;--warn:#ffb454;--glass:rgba(22,30,50,.55);--border:rgba(130,155,200,.22);}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg0);overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:-3;background:
    radial-gradient(900px 640px at 14% 8%,rgba(53,208,224,.16),transparent 60%),
    radial-gradient(840px 600px at 88% 92%,rgba(183,140,255,.18),transparent 58%),
    radial-gradient(700px 560px at 70% 12%,rgba(255,111,181,.10),transparent 60%),
    linear-gradient(180deg,var(--bg0),var(--bg1));animation:drift 30s ease-in-out infinite alternate}
  @keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-2%,2%,0) scale(1.05)}100%{transform:translate3d(2%,-1.5%,0) scale(1.04)}}
  .grid{position:fixed;inset:-2px;z-index:-2;opacity:.45;pointer-events:none;
    background-image:linear-gradient(rgba(120,160,220,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,220,.06) 1px,transparent 1px);
    background-size:46px 46px;mask-image:radial-gradient(80% 70% at 50% 30%,#000,transparent);animation:gridmove 40s linear infinite}
  @keyframes gridmove{to{background-position:460px 460px}}
  .wires{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none;opacity:.7}
  .wires path{fill:none;stroke-width:1.4;stroke-linecap:round;filter:drop-shadow(0 0 4px currentColor)}
  .flow{stroke-dasharray:5 240;animation:flow 5.5s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-245}}
  header{padding:30px 34px 6px;max-width:980px;margin:0 auto;position:relative}
  h1{margin:0;font-size:34px;letter-spacing:5px;font-weight:800;
    background:linear-gradient(90deg,#35d0e0,#b78cff,#ff6fb5,#35d0e0);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both,sheen 8s linear infinite}
  @keyframes sheen{to{background-position:300% 0}}
  @keyframes rise{from{opacity:0;transform:translateY(14px);letter-spacing:14px}to{opacity:1;transform:none}}
  .sub{color:var(--muted);font-size:13.5px;margin-top:5px;animation:rise 1s .1s cubic-bezier(.2,.8,.2,1) both}
  .tabs{display:flex;gap:10px;margin:16px auto 0;max-width:980px;padding:0 34px}
  .tabs button{cursor:pointer;background:var(--glass);backdrop-filter:blur(10px);color:var(--ink);border:1px solid var(--border);border-radius:12px;padding:10px 18px;font-size:14px;font-weight:600;transition:.25s}
  .tabs button.on{border-color:var(--acc);box-shadow:0 0 0 1px rgba(53,208,224,.4),0 0 22px rgba(53,208,224,.25);background:linear-gradient(180deg,rgba(53,208,224,.18),rgba(53,208,224,.05))}
  .wrap{max-width:980px;margin:0 auto;padding:14px 34px 80px}
  .view{animation:fadein .45s ease both}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .hide{display:none}
  .prog{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;padding:12px 0 14px;font-size:12.5px;color:var(--muted)}
  .pbar{flex:1;height:7px;border-radius:9px;background:rgba(130,155,200,.14);overflow:hidden}
  .pbar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--acc3));box-shadow:0 0 14px rgba(53,208,224,.6);transition:width .6s cubic-bezier(.34,1.4,.5,1)}
  .pct{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
  .seclabel{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--ca,var(--acc2));font-weight:800;margin:26px 0 14px}
  .seclabel::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ca,var(--acc2)),transparent);opacity:.5}
  .row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:16px;opacity:0;transform:translateY(16px)}
  .row.in{opacity:1;transform:none;transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}
  .spine{position:relative;display:flex;justify-content:center}
  .spine::before{content:"";position:absolute;top:-14px;bottom:-14px;width:2px;background:rgba(130,155,200,.18)}
  .spine .pulse{position:absolute;top:0;width:2px;height:34px;background:linear-gradient(180deg,transparent,var(--ca,var(--acc)),transparent);filter:blur(.5px);animation:spinepulse 3.2s linear infinite;opacity:0}
  .row.in .spine .pulse{opacity:.9}
  @keyframes spinepulse{0%{top:-10%}100%{top:110%}}
  .dot{width:13px;height:13px;border-radius:50%;margin-top:20px;z-index:1;background:var(--bg1);border:2px solid var(--ca,var(--acc));transition:.4s cubic-bezier(.34,1.56,.64,1)}
  .row.open .dot{background:var(--ca,var(--acc));transform:scale(1.4);box-shadow:0 0 18px var(--ca,var(--acc))}
  .card{position:relative;background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--border);border-left:3px solid var(--ca,var(--acc));
    border-radius:16px;margin-bottom:16px;overflow:hidden;cursor:pointer;transform-style:preserve-3d;
    transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));
    transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s}
  .card:hover{--ty:-3px;border-color:var(--ca,var(--acc));box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 30px -8px var(--ca,var(--acc))}
  .card.open{box-shadow:0 16px 44px rgba(0,0,0,.55),0 0 34px -6px var(--ca,var(--acc))}
  .head{display:flex;align-items:center;gap:14px;padding:16px}
  .meta{min-width:0;flex:1}
  .title{font-size:16px;font-weight:700}
  .hook{color:var(--muted);font-size:12.5px;margin-top:2px}
  .tw{flex:none;color:var(--ca,var(--acc));font-family:ui-monospace,monospace;font-size:12px;padding:3px 10px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.04)}
  .chev{flex:none;color:var(--ca,var(--acc));font-size:15px;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
  .card.open .chev{transform:rotate(180deg)}
  .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .46s cubic-bezier(.34,1.4,.5,1)}
  .card.open .body{grid-template-rows:1fr}
  .bclip{overflow:hidden}
  .bin{padding:0 16px 17px;opacity:0;transform:translateY(-8px);transition:opacity .34s ease .06s,transform .34s ease .06s}
  .card.open .bin{opacity:1;transform:none}
  .segp{display:inline-flex;gap:4px;background:rgba(8,12,22,.55);border:1px solid var(--border);border-radius:11px;padding:4px;margin:2px 0 13px}
  .segp button{cursor:pointer;border:none;background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.4px;padding:6px 12px;border-radius:8px;transition:.25s}
  .segp button.on{color:#06101d;background:var(--seg,var(--acc));box-shadow:0 0 16px -2px var(--seg,var(--acc))}
  .pane{font-size:13.8px;line-height:1.65;color:#dbe6fb;min-height:78px;transition:opacity .24s ease}
  .pane.fade{opacity:0}
  .extra{margin-top:14px;border-top:1px solid var(--border);padding-top:13px}
  .xh{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--acc2);font-weight:800;margin-bottom:10px}
  .prov{border-left:3px solid var(--acc);background:rgba(8,12,22,.4);border-radius:0 10px 10px 0;padding:9px 12px;margin-bottom:9px}
  .pname{font-size:13px;font-weight:700}
  .pfree{display:block;font-size:11px;font-weight:400;color:var(--muted);font-family:ui-monospace,monospace;margin-top:3px;line-height:1.5}
  .pwhy{font-size:12.5px;line-height:1.55;color:#cdd9ef;margin-top:6px}
  .pwhy b,.pick b{color:var(--ink)}
  .extra code{font-family:ui-monospace,monospace;font-size:11.5px;background:rgba(53,208,224,.1);color:var(--acc);padding:1px 5px;border-radius:5px}
  .pick{margin-top:12px;font-size:12.5px;color:#cdd9ef}
  .pick ul{margin:7px 0 0;padding-left:18px;line-height:1.7}
  .pick li{margin-bottom:4px}
  .caveat{margin-top:12px;border:1px solid rgba(255,180,84,.4);background:rgba(255,180,84,.07);border-radius:10px;padding:10px 12px;font-size:12.3px;line-height:1.6;color:#f0dcc0}
  .caveat b{color:var(--warn)}
  .tip{margin-top:10px;border-left:3px solid var(--acc);background:rgba(8,12,22,.4);border-radius:0 10px 10px 0;padding:9px 12px;font-size:12.3px;line-height:1.6;color:#cdd9ef}
  .tip b{color:var(--acc)}
  .xrow{display:flex;justify-content:flex-end;margin-top:16px}
  .xbtn{cursor:pointer;border:1px solid var(--border);background:rgba(8,12,22,.55);color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.4px;padding:6px 14px;border-radius:9px;transition:.25s}
  .xbtn:hover{color:var(--ink);border-color:var(--acc3)}
  .card.explore-open .xbtn{color:#1a0512;background:var(--acc3);border-color:var(--acc3);box-shadow:0 0 18px -2px var(--acc3)}
  .exwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .44s cubic-bezier(.34,1.4,.5,1)}
  .card.explore-open .exwrap{grid-template-rows:1fr}
  .exclip{overflow:hidden}
  .exin{padding-top:14px}
  .excat{border:1px solid var(--cc);border-left:3px solid var(--cc);background:rgba(8,12,22,.42);border-radius:0 12px 12px 0;padding:11px 13px;margin-bottom:11px;box-shadow:0 0 16px -10px var(--cc);transition:box-shadow .3s,transform .3s}
  .excat:hover{box-shadow:0 0 22px -6px var(--cc);transform:translateX(2px)}
  .excat .ech{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;color:var(--cc);margin-bottom:7px}
  .excat p{margin:0;font-size:12.6px;line-height:1.6;color:#cdd9ef}
  .excat ul{margin:6px 0 0;padding-left:18px}
  .excat li{font-size:12.6px;line-height:1.6;color:#cdd9ef;margin-bottom:5px}
  .excat code{font-family:ui-monospace,monospace;font-size:11.5px;background:rgba(255,255,255,.06);color:var(--cc);padding:1px 5px;border-radius:5px}
  .excat b{color:var(--ink)}
  .goal{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:16px}
  .goal h2{margin:0 0 5px;font-size:17px}
  .goal p{margin:0;color:var(--muted);font-size:13px}
  .chalpick{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
  .chalpick button{cursor:pointer;background:var(--glass);backdrop-filter:blur(10px);color:var(--ink);border:1px solid var(--border);border-radius:11px;padding:8px 14px;font-size:12.5px;font-weight:600;transition:.25s}
  .chalpick button.on{border-color:var(--acc2);box-shadow:0 0 20px -4px var(--acc2);background:linear-gradient(180deg,rgba(183,140,255,.2),rgba(183,140,255,.05))}
  .chalpick button.done::after{content:' ✓';color:var(--ok);font-weight:800}
  .line{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin:20px 0;position:relative}
  .slot{width:158px;min-height:80px;border:2px dashed rgba(130,155,200,.4);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7px;background:rgba(255,255,255,.02);transition:.18s}
  .slot .ph{color:var(--muted);font-size:11px;line-height:1.3}
  .slot.over{border-color:var(--acc);background:rgba(53,208,224,.1);box-shadow:0 0 22px -6px var(--acc)}
  .slot.bad{border-color:var(--bad)!important;background:rgba(255,93,108,.14);animation:shake .35s}
  .slot.filled{border-style:solid;border-color:var(--ok);background:rgba(81,224,138,.09);box-shadow:0 0 22px -8px var(--ok)}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
  .arrow{align-self:center;color:var(--muted);font-size:20px;transition:.3s}
  .arrow.live{color:var(--ok);text-shadow:0 0 12px var(--ok);animation:zap .5s}
  @keyframes zap{0%{transform:scale(.6);opacity:.2}60%{transform:scale(1.4)}100%{transform:scale(1)}}
  .palette{display:flex;flex-wrap:wrap;gap:11px;margin-top:8px;padding:16px;border:1px solid var(--border);border-radius:16px;background:rgba(8,12,22,.45);backdrop-filter:blur(10px)}
  .chip{cursor:grab;user-select:none;background:linear-gradient(180deg,rgba(30,42,68,.95),rgba(18,26,44,.95));border:1px solid var(--border);border-left:3px solid var(--c,var(--acc));border-radius:12px;padding:10px 13px;min-width:148px;text-align:center;transition:transform .2s,box-shadow .2s}
  .chip:hover{transform:translateY(-2px);box-shadow:0 0 22px -8px var(--c,var(--acc))}
  .chip:active{cursor:grabbing}
  .chip.gone{opacity:.22;pointer-events:none;filter:grayscale(1)}
  .chip .t{font-size:13px;font-weight:700}
  .chip .s{font-size:10.5px;color:var(--muted);font-family:ui-monospace,monospace}
  .filledchip{font-size:12.5px;font-weight:700}.filledchip .s{display:block;font-size:10px;color:var(--muted);font-family:ui-monospace,monospace;font-weight:400}
  .msg{margin-top:16px;font-size:13.8px;min-height:22px}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
  .btn{cursor:pointer;background:var(--glass);backdrop-filter:blur(10px);color:var(--ink);border:1px solid var(--border);border-radius:11px;padding:8px 15px;font-size:12.5px;margin-top:14px;transition:.2s}
  .btn:hover{border-color:var(--acc)}
  .burst{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none}
  footer{color:#46587e;font-size:11px;text-align:center;padding:8px 0 30px}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>
<svg class="wires" id="wires" preserveAspectRatio="none"></svg>
<header>
  <h1>BUILD-A-STACK</h1>
  <div class="sub">Learn how real systems connect — bridges, ports, sockets, gateways — then wire one yourself. Built off the Tradenificent Stack Map.</div>
</header>
<div class="tabs"><button id="tab-learn" class="on">📖 Learn</button><button id="tab-build">🔧 Build</button></div>
<div class="wrap">
  <div id="view-learn" class="view">
    <div class="prog"><span>explored <span class="pct" id="pc">0</span>/<span id="tot">0</span></span><span class="pbar"><i id="fill"></i></span></div>
    <div id="learn-list"></div>
  </div>
  <div id="view-build" class="view hide">
    <div class="chalpick" id="chalpick"></div>
    <div class="goal"><h2 id="goalh"></h2><p id="goalp"></p></div>
    <div class="line" id="line"></div>
    <div class="palette" id="palette"></div>
    <div class="msg" id="msg"></div>
    <button class="btn" id="reset">↺ reset</button>
  </div>
</div>
<footer>Self-contained · open in any browser · Phase A·1–A·2 (22 concepts) · Phase B·1–B·2 (4 challenges)</footer>
<script>
/* ===== living background wires ===== */
(function(){
  const svg=document.getElementById('wires');const W=1200,H=900;svg.setAttribute('viewBox','0 0 '+W+' '+H);
  const cols=['#35d0e0','#b78cff','#ff6fb5'];
  let s='';
  for(let i=0;i<7;i++){
    const y=80+i*120+(i%2?30:0); const c=cols[i%3];
    const d='M -20 '+y+' C '+(W*0.25)+' '+(y-70)+', '+(W*0.55)+' '+(y+70)+', '+(W+20)+' '+(y-20);
    s+='<path d="'+d+'" stroke="'+c+'" style="color:'+c+';opacity:.16"></path>';
    s+='<path class="flow" d="'+d+'" stroke="'+c+'" style="color:'+c+';animation-delay:'+(-i*0.8)+'s"></path>';
  }
  svg.innerHTML=s;
})();

/* ===== LEARN: glossary (A·1 fundamentals + A·2 intermediate) ===== */
const GLOSSARY = [
  {sec:'Fundamentals — the building blocks', t:'Port', tw:':3004', h:'a numbered door a service listens on',
   d:'A port is a numbered channel on a machine (like :3004) where one running program listens for connections. Only one program can hold a given port at a time.',
   s:'Every box on your Stack Map has one — market-state :3004, the dashboard :5174, the bridges :3000–:3005. "EADDRINUSE" means two things fought over the same port (that is exactly what killed your CORTEX bridge).',
   p:'Same idea in production, but users hit ONE public port (443/https) and a reverse proxy (nginx) routes to the internal ports behind it.',
   x:'<div class="excat" style="--cc:#35d0e0"><div class="ech">📚 More examples — ports in the wild</div>'+
     '<p>Numbers you will meet everywhere:</p><ul>'+
     '<li><code>80</code> HTTP · <code>443</code> HTTPS · <code>22</code> SSH · <code>3306</code> MySQL · <code>5432</code> Postgres · <code>6379</code> Redis · <code>27017</code> MongoDB · <code>8080</code> dev/alt HTTP</li>'+
     '<li><b>Ranges:</b> <code>0–1023</code> well-known (need admin) · <code>1024–49151</code> registered · <code>49152–65535</code> ephemeral (the OS hands these out for outbound connections).</li>'+
     '<li>Your stack deliberately sits in the registered range (<code>3000–5174</code>) — high enough to skip admin, low enough to remember.</li>'+
     '</ul></div>'+
     '<div class="excat" style="--cc:#51e08a"><div class="ech">✏️ Editing / changing a port</div><ul>'+
     '<li><b>See what owns a port</b> (Windows): <code>Get-NetTCPConnection -LocalPort 3004</code> or <code>netstat -ano | findstr :3004</code> → it gives you the PID.</li>'+
     '<li><b>Free a stuck port</b> (the EADDRINUSE fix): find that PID, then <code>Stop-Process -Id &lt;pid&gt;</code>. Something already owns the door.</li>'+
     '<li><b>Change a service’s port:</b> it is almost always a config/env value — e.g. <code>PORT=3004</code> in <code>.env</code>, or a constant in the source. Change it, restart the service, and update anything that talks to it.</li>'+
     '<li><b>The one rule:</b> one program per port. If two want the same one, the first wins and the second crashes with <code>EADDRINUSE</code>.</li>'+
     '</ul></div>'+
     '<div class="excat" style="--cc:#b78cff"><div class="ech">🛠️ How to edit this card’s text (the tool itself)</div>'+
     '<p>This whole tool is ONE file (<code>Build_a_Stack.html</code>). Every card’s text lives in a JavaScript array called <code>GLOSSARY</code> inside the <code>&lt;script&gt;</code> block — e.g. <code>{t:&#39;Port&#39;, d:&#39;…&#39;, s:&#39;…&#39;, p:&#39;…&#39;}</code>. It is hardcoded, not a separate database.</p><ul>'+
     '<li><b>Fastest — Ctrl+F:</b> open the file in a code editor (VS Code / Notepad++), press <b>Ctrl+F</b>, search a unique phrase from the card (e.g. “users hit ONE public port”), and type your new text right over the old.</li>'+
     '<li><b>If you cannot find it in the HTML:</b> the data might sit in a separate <code>.json</code> file — open the page, press <b>F12 → Network</b>, refresh, and look for a <code>.json</code> file; edit that one instead.</li>'+
     '<li><b>See exactly where text renders:</b> right-click the text on the page → <b>Inspect</b> → DevTools highlights the exact element and its class names.</li>'+
     '<li><b>For THIS tool specifically:</b> it is all in the one HTML’s <code>GLOSSARY</code> array — no separate JSON file — so Ctrl+F is all you need.</li>'+
     '</ul></div>'},
  {t:'Process / Service', tw:'running', h:'a program that stays running',
   d:'A service is just a program left running, waiting to do work (answer requests, push data). It has an ID, can crash, and can be restarted.',
   s:'Each node on the map is a service: tv-bridge, market-state, the dashboard. When one "goes red," its process died or its port stopped answering.',
   p:'Production runs services in containers (Docker) so they are isolated, reproducible, and restart on a policy — instead of loose programs on one PC.'},
  {t:'Node.js', tw:'runtime', h:'runs JavaScript outside the browser',
   d:'Node.js is a runtime that lets JavaScript run as a normal program (a server), not just inside a web page. It is great at handling lots of network connections at once.',
   s:'Almost every box on your map is a Node.js service — the bridges, the engine, the sink, the dashboards. They are all "node <file>.js".',
   p:'Same in production; the difference is how they are supervised and deployed, not the runtime.'},
  {t:'API', tw:'contract', h:'a defined way to ask a program for something',
   d:'An API (Application Programming Interface) is the agreed set of requests a program accepts — "ask me this way, I will answer that way." It hides the internals behind a clean contract.',
   s:'TopStep X exposes an API your bots call to place orders. Your bridges expose little APIs too (e.g. tv-bridge /chart/quote).',
   p:'Production APIs add auth, versioning, rate limits, and docs. Yours are bare localhost endpoints — fine for one machine, not for the public.'},
  {t:'HTTP request (GET / POST)', tw:'GET/POST', h:'the most common API call',
   d:'HTTP is the request/response pattern of the web. GET = "give me data," POST = "here is data, do something." You ask once, you get one answer, the connection closes.',
   s:'The Stack Map polls /health endpoints over HTTP; the dashboard posts trade commands over HTTP to the trade-bridge.',
   p:'Same — but production puts it behind HTTPS + a proxy, and prefers a stream (below) for anything live.'},
  {t:'Socket / WebSocket', tw:'live pipe', h:'a persistent two-way live stream',
   d:'A WebSocket is an always-open pipe between two programs. Instead of asking again and again, the connection stays open and either side can send the moment something changes.',
   s:'market-state (:3004) publishes over a WebSocket; market-sink subscribes to it and gets every update instantly. The Stack Map itself now uses a live stream (SSE) for ~1.5s updates.',
   p:'Same tool in production — often hardened with reconnect logic, auth tokens, and a message bus behind it.'},
  {t:'Bridge', tw:'adapter', h:'translates between two things that can’t talk directly',
   d:'A bridge is a small service whose only job is to sit between two systems that speak different "languages" and translate, so they can work together.',
   s:'tv-bridge lets your engine read a TradingView chart; trade-bridge lets a bot place orders on Tradovate WITHOUT the paid API by capturing the live token. Bridges are the glue of your stack.',
   p:'Bridges are legit — but a token-capture bridge is a workaround around a closed/expensive API. Production would use the official API and skip the bridge.'},
  {t:'Gateway', tw:'entry point', h:'one front door that routes to many services',
   d:'A gateway is a single entry point that receives traffic and routes it to the right internal service, often adding auth, logging, or message handling along the way.',
   s:'Your Hermes gateway is the one place Telegram/Discord messages flow through to reach the right handler.',
   p:'Production puts an API gateway / reverse proxy in front of everything as the single hardened door.'},
  {t:'Webhook', tw:'call-me-back', h:'a server pushes to YOUR url on an event',
   d:'A webhook flips the direction: instead of you asking, another system calls a URL you gave it the moment an event happens ("a trade alert fired").',
   s:'TradingView alerts hit your webhook-receiver (:3000), which routes them to the right bot. It is push, triggered by events.',
   p:'Same pattern; production adds a shared secret/signature so you know the call is really from the sender.'},
  {t:'Watchdog', tw:'∞ loop', h:'restarts a service when it dies',
   d:'A watchdog is a small loop (or supervisor) that notices when a service stops and starts it again — so the system heals itself instead of staying down.',
   s:'Your run-*.bat wrappers are watchdogs: they relaunch a node service 5s after any exit, and Task Scheduler runs them at logon. (When those got deleted, your whole stack failed to come back.)',
   p:'Production uses a real supervisor — Docker restart policies, systemd, or Kubernetes — with health checks, instead of .bat loops.'},
  {t:'Push vs Poll', tw:'efficiency', h:'be told vs keep asking',
   d:'Poll = ask over and over "anything new?" (simple, wasteful). Push = the source tells you the instant something changes (efficient, a bit more setup). Most live systems want push.',
   s:'Your old bots polled the chart every cycle (expensive). The market-state engine flipped it to push: read once, push to everyone. The map does the same with SSE.',
   p:'Identical principle at any scale — push + a message bus is the production shape.'},
  {t:'MCP (Model Context Protocol)', tw:'AI tools', h:'a standard way to give an AI tools & data',
   d:'MCP is a shared standard for connecting an AI model to tools and data sources, so the model can DO things (read a chart, place an order) instead of just talking.',
   s:'Your TradingView MCP and TopStep MCP are how an AI agent reads the chart and the account through one common interface.',
   p:'Same — MCP is itself the modern, fairly senior way to wire AI into a stack.'},

  {sec:'Intermediate — how the pieces really talk', t:'IPC (file feed)', tw:'JSON files', h:'two programs talk by sharing a file',
   d:'Inter-process communication is how separate programs hand data to each other. The simplest form: one writes a file, the other reads it — no network, no protocol, just the filesystem as a shared mailbox.',
   s:'This is your last hop. market-sink writes market-state.json / market-events.json, and the Tradenificent and Paperclip runtimes READ those files. The WebSocket only carries engine→sink — the bots actually get their data as files.',
   p:'Files are dead-simple and survive restarts, but there is no ordering, no backpressure, and no “you missed an update” signal. Production replaces this hop with a message bus (next card).'},
  {t:'Message bus / queue', tw:'broker', h:'a middleman that fans data out reliably',
   d:'A message bus (or queue) sits between producers and consumers: producers drop messages in, consumers pull them out, and the bus guarantees delivery, ordering, and replay. It decouples who-sends from who-receives.',
   s:'You do not run one — the engine→sink→file chain is your stand-in. It works on a single machine, but it is the biggest “production ideal” gap in your data path.',
   p:'Production uses Kafka / Redis Streams / RabbitMQ so a slow or crashed consumer never loses messages, and you can add new consumers without touching the producer.'},
  {t:'CDP (Chrome DevTools Protocol)', tw:':9222', h:'remote-control a Chromium app over a port',
   d:'CDP is the protocol Chromium exposes on a debug port (like :9222) that lets another program drive the browser — read the page, run scripts, pull data — exactly as the DevTools panel would.',
   s:'tv-bridge speaks CDP to TradingView Desktop on :9222 to read the live chart. Key gotcha: :9222 must be the ACTUAL app, not a stale Chrome — launch the TradingView MSIX exe directly with --remote-debugging-port=9222.',
   p:'Driving a desktop app over CDP is a scrape — a workaround around having no official data API. It is brittle (breaks on app updates) and is the honest reason this hop exists. Production consumes a real market-data feed instead.'},
  {t:'Environment variables', tw:'.env', h:'config injected at runtime, not baked into code',
   d:'Environment variables are key=value settings the OS hands a process when it starts. They keep configuration — and secrets — OUT of the source, so the same code runs in dev and prod with different values.',
   s:'Your services read tradenificent\\.env: TSX_API_KEY, ANTHROPIC_API_KEY, DISCORD_TOKEN, and TSX_USERNAME=Manqoba (the handle, not the email — the email fails with errorCode 3).',
   p:'Using .env is correct. The gap: some keys are also hardcoded in tracked .bat files in plaintext (a TopStep key is flagged for rotation). Production loads secrets from a manager, never from a committed file.'},
  {t:'Secrets', tw:'🔑 never commit', h:'keys that grant access — guard them',
   d:'A secret is any credential — API key, token, password — that grants access to something. The cardinal rule: never commit one to git and never print it where it can be logged or copied.',
   s:'Yours: the TopStep API key, the Anthropic key, the Discord token, and the trade-bridge’s captured broker token. Live TODO: rotate the TOPSTEPX_API_KEY committed in plaintext, and the PAT that leaked into a transcript.',
   p:'Production stores secrets in a vault (HashiCorp Vault, AWS/GCP secret manager), rotates them automatically, and scopes each to least privilege. Plaintext-in-a-file is the debt to pay down.'},
  {t:'Reverse proxy', tw:'one front door', h:'one public port routes to many internal ones',
   d:'A reverse proxy accepts all incoming traffic on one address, then forwards each request to the right internal service — handling HTTPS, logging, and rate limits in that one place.',
   s:'You do not have one — every service answers on its own bare localhost port (:3000–:5174), exactly as the Stack Map draws them. Fine for one trusted machine, and it is why nothing here is internet-exposed.',
   p:'Production puts nginx / Caddy / Traefik in front, so users hit ONE hardened 443 door and never see the internal ports. It is the production version of your “Gateway” and “Port” cards combined.'},
  {t:'Tunnel / ingress (ngrok vs Cloudflare)', tw:'localhost → internet', h:'expose a local port to the public web',
   d:'A tunnel runs a small agent on your machine that opens an OUTBOUND connection to a provider’s edge; the provider then forwards public internet traffic back down to your localhost port. No router config, no open firewall ports, no public IP — a service on :3000 becomes a public https URL.',
   s:'This is how a TradingView alert (born on the public internet) reaches your webhook-receiver :3000 on a home PC behind a router. You switched ngrok → Cloudflare here on 2026-05-31 for ONE reason — Norton (see the caveat below) — not price or URLs. One named cloudflared tunnel can expose both the Paperclip receiver (:3000) and the dashboard webhook (:3001) from a single Windows service.',
   p:'A tunnel is itself a legit production pattern (Cloudflare Tunnel runs in real deployments). The most "production" version adds a stable domain + auth + a real reverse proxy in front — but for a home box, a named Cloudflare Tunnel basically IS that answer.',
   extra:'<div class="xh">ngrok vs Cloudflare Tunnel — at a glance</div>'+
     '<div class="prov" style="border-left-color:#ff6fb5"><div class="pname">ngrok<span class="pfree">free: 1 GB/mo · 20k req/mo · 3 endpoints · 1 static *.ngrok-free.dev · browser interstitial page</span></div><div class="pwhy"><b>Edge:</b> fastest to start (<code>ngrok http 3000</code>) and a built-in request inspector / replay at :4040. <b>Best for:</b> quick tests, demos, debugging webhooks.</div></div>'+
     '<div class="prov" style="border-left-color:#35d0e0"><div class="pname">Cloudflare Tunnel<span class="pfree">free: NO bandwidth cap · never expires · unlimited tunnels · stable custom domain (named) OR random *.trycloudflare.com (quick)</span></div><div class="pwhy"><b>Edge:</b> free with no caps, a stable custom domain, DDoS protection and Access (auth) in front; runs as a service. <b>Best for:</b> always-on webhook ingestion, production-ish, a free custom domain. Named tunnels need a domain on Cloudflare DNS (free plan works).</div></div>'+
     '<div class="prov" style="border-left-color:#b78cff"><div class="pname">Tailscale Funnel<span class="pfree">free (personal): stable *.ts.net URL</span></div><div class="pwhy"><b>Edge:</b> dead-simple and ties into your private tailnet. <b>Best for:</b> mostly-private services you occasionally expose to the public.</div></div>'+
     '<div class="pick"><b>Which should you use?</b><ul>'+
     '<li><b>10-second test:</b> ngrok <code>ngrok http 3000</code>, or Cloudflare quick <code>cloudflared tunnel --url localhost:3000</code> (no account, random URL).</li>'+
     '<li><b>Always-on receiver — your TradingView → webhook-receiver :3000:</b> <span style="color:var(--acc)">Cloudflare Tunnel, named</span> — free, stable URL, no caps. (It is why <code>cloudflared.exe</code> already sits in your bin.)</li>'+
     '<li><b>Inspect / replay incoming webhooks while building:</b> ngrok’s inspector at :4040.</li>'+
     '<li><b>Mostly private, rare public:</b> Tailscale Funnel.</li>'+
     '</ul></div>'+
     '<div class="caveat"><b>⚠️ Edge case most setups never hit — but worth knowing:</b> if a machine runs a <b>TLS-inspecting</b> security suite or corporate proxy (some antivirus, Zscaler, and similar middleboxes), it MITM-intercepts outbound HTTPS. Because ngrok’s agent rides plain <b>TCP/443</b>, that interception can <b>silently break the tunnel</b> — with no agent-side fix, and a paid plan does not help (it is not a tier issue). <b>Cloudflare Tunnel reaches its edge over QUIC/UDP</b>, which HTTPS scanners usually do not touch, so it routes around the problem. <i>Real example:</i> this very stack switched ngrok → Cloudflare on 2026-05-31 for exactly this (Norton Web Shield), nothing else. Takeaway: on a normal home/dev box <b>both work great</b> — but if a TLS-inspecting middlebox sits in the path, prefer a QUIC/UDP tunnel.</div>'+
     '<div class="tip"><b>Bonus — one tunnel, many services:</b> a single Cloudflare <i>named</i> tunnel exposes multiple local ports via ingress rules — e.g. <code>paperclip.you.com → :3000</code> and <code>dash.you.com → :3001</code> from one process, two stable hostnames, free. ngrok needs a separate paid endpoint per service.</div>'},
  {t:'DNS / domains', tw:'name → address', h:'turns a name into a server address',
   d:'DNS (Domain Name System) is the internet’s phone book: it translates a human name (yourname.com) into the machine address that actually answers. A "domain" is the name you own and point wherever you want via DNS records — A = name→IP, CNAME = name→another name, TXT = verification / metadata.',
   s:'Your named Cloudflare Tunnel needs a domain whose DNS lives at Cloudflare — cloudflared writes a CNAME like webhook.yourdomain.com → your-tunnel.cfargotunnel.com, so TradingView can post to a STABLE name instead of a random URL that changes on restart. You have a GoDaddy domain earmarked (tradenificent.com); pointing its nameservers at Cloudflare (free, does not move where the site is hosted) is what unlocks the named tunnel.',
   p:'DNS is DNS everywhere. The "production" upgrades are operational: short TTLs for fast failover, health-checked / geo DNS load-balancing, and DNSSEC so records cannot be spoofed. For one tunnel, a single CNAME is the whole job.'},
  {t:'TLS / HTTPS certificates', tw:'🔒 the s in https', h:'proves identity + encrypts the connection',
   d:'TLS is the lock on https — it encrypts traffic so nobody in the middle can read it, and a certificate (issued by a trusted authority) proves the server really is who the name claims. The browser trusts it because the cert chains up to a root CA already in its trust store.',
   s:'You mostly do not manage certs — Cloudflare terminates TLS at its edge and presents a valid cert for your domain automatically, so your localhost services can stay plain http behind the tunnel. The flip side you have already felt: a TLS-inspecting middlebox (Norton) re-signs certs with its OWN root mid-connection — that is the same MITM that broke ngrok in the Tunnel card above.',
   p:'Production automates the whole lifecycle — free certs from Let’s Encrypt via ACME, auto-renewed every ~90 days by the reverse proxy (Caddy / Traefik do it transparently). The anti-pattern is a hand-issued cert nobody remembers to renew — it expires and every client throws scary security warnings.'},
  {t:'Health check', tw:'/health', h:'a heartbeat endpoint a monitor can poll',
   d:'A health check is a tiny endpoint (often /health) a service exposes so a supervisor can ask “are you alive and OK?” and get a fast yes/no — without doing real work.',
   s:'Your bridges and engine expose /health; the Stack Map’s :3009 helper polls them for rich vitals (and TCP-connects the UI-only nodes). That is what flips a node green or red within ~1.5s of a change.',
   p:'Same concept; production wires health checks INTO the orchestrator (Kubernetes liveness/readiness probes) so a failing service is auto-restarted or pulled from rotation — not just shown red on a map.'},
];

  card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect();const px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
    card.style.setProperty('--ry',(px*7).toFixed(2)+'deg');card.style.setProperty('--rx',(-py*7).toFixed(2)+'deg');});
  card.addEventListener('pointerleave',()=>{card.style.setProperty('--ry','0deg');card.style.setProperty('--rx','0deg');});

function prog(){const n=opened.size;document.getElementById('pc').textContent=n;document.getElementById('fill').style.width=Math.round(n/GLOSSARY.length*100)+'%';}
const io=new IntersectionObserver((es)=>{es.forEach(en=>{if(en.isIntersecting){const idx=[...learnList.querySelectorAll('.row')].indexOf(en.target);en.target.style.transitionDelay=(Math.min(idx,6)*55)+'ms';en.target.classList.add('in');io.unobserve(en.target);}})},{threshold:.05});

let cur=0;const doneSet=new Set();let CHAIN=[],DISTRACTORS=[];
const line=document.getElementById('line'),palette=document.getElementById('palette'),msg=document.getElementById('msg'),
  goalh=document.getElementById('goalh'),goalp=document.getElementById('goalp'),chalpick=document.getElementById('chalpick');
function renderPicker(){chalpick.innerHTML='';CHALLENGES.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.tab;if(i===cur)b.classList.add('on');if(doneSet.has(c.id))b.classList.add('done');b.addEventListener('click',()=>{cur=i;build();});chalpick.appendChild(b);});}
let audio=null;
function tone(f,d,t){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(audio.destination);const n=audio.currentTime;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.22,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.start(n);o.stop(n+d+.03);}catch(e){}}
const buzz=()=>tone(160,.18,'square');
const ding=()=>{tone(720,.12);setTimeout(()=>tone(990,.16),110);};
const surge=()=>{tone(330,.1);setTimeout(()=>tone(523,.1),90);setTimeout(()=>tone(784,.18),190);setTimeout(()=>tone(1046,.3),300);};
let filled=0;
function build(){
  const C=CHALLENGES[cur];CHAIN=C.chain;DISTRACTORS=C.distractors;goalh.textContent=C.title;goalp.textContent=C.desc;renderPicker();
  line.innerHTML='';palette.innerHTML='';msg.textContent='';msg.className='msg';filled=0;
  CHAIN.forEach((n,i)=>{
    const slot=document.createElement('div');slot.className='slot';slot.dataset.expect=n.id;slot.dataset.idx=i;slot.innerHTML=`<div class="ph">slot ${i+1}<br>drop here</div>`;
    slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('over');});
    slot.addEventListener('dragleave',()=>slot.classList.remove('over'));
    slot.addEventListener('drop',e=>{e.preventDefault();slot.classList.remove('over');onDrop(slot,e.dataTransfer.getData('text/plain'));});
    line.appendChild(slot);
    if(i<CHAIN.length-1){const a=document.createElement('div');a.className='arrow';a.textContent='→';line.appendChild(a);}
  });
  shuffle(CHAIN.concat(DISTRACTORS)).forEach(n=>{
    const chip=document.createElement('div');chip.className='chip';chip.draggable=true;chip.dataset.id=n.id;chip.style.setProperty('--c',n.c);
    chip.innerHTML=`<div class="t">${n.t}</div><div class="s">${n.s}</div>`;
    chip.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',n.id));
    palette.appendChild(chip);
  });
}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=r[i];r[i]=r[j];r[j]=t;}return r;}
function onDrop(slot,id){
  if(slot.classList.contains('filled'))return;
  if(id===slot.dataset.expect){
    const n=CHAIN.find(c=>c.id===id);
    slot.classList.add('filled');slot.innerHTML=`<div class="filledchip">${n.t}<span class="s">${n.s}</span></div>`;
    const chip=palette.querySelector('.chip[data-id="'+id+'"]');if(chip)chip.classList.add('gone');
    ding();filled++;
    if(filled===CHAIN.length)completeFlow();
  } else {
    slot.classList.add('bad');setTimeout(()=>slot.classList.remove('bad'),350);
    const exp=CHAIN.find(c=>c.id===slot.dataset.expect);
    buzz();msg.className='msg bad';msg.textContent='⛔ That piece does not belong in slot '+(+slot.dataset.idx+1)+'. This slot needs whatever the data flows into next ('+(exp?exp.t:'?')+').';
  }
}
function completeFlow(){
  const arrows=[...line.querySelectorAll('.arrow')];surge();
  arrows.forEach((a,k)=>setTimeout(()=>a.classList.add('live'),k*180));
  setTimeout(()=>{msg.className='msg ok';msg.innerHTML=CHALLENGES[cur].done;doneSet.add(CHALLENGES[cur].id);renderPicker();burst();},arrows.length*180+150);
}
function burst(){
  const slots=line.querySelectorAll('.slot.filled');if(!slots.length)return;
  const last=slots[slots.length-1];const r=last.getBoundingClientRect(),lr=line.getBoundingClientRect();
  const cx=r.left-lr.left+r.width/2,cy=r.top-lr.top+r.height/2;const cols=['#35d0e0','#b78cff','#ff6fb5','#51e08a'];
  for(let i=0;i<18;i++){const p=document.createElement('div');p.className='burst';p.style.left=cx+'px';p.style.top=cy+'px';p.style.background=cols[i%4];p.style.boxShadow='0 0 10px '+cols[i%4];line.appendChild(p);
    const ang=(Math.PI*2*i)/18,dist=50+Math.random()*70;
    p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(ang)*dist+'px,'+Math.sin(ang)*dist+'px) scale(0)',opacity:0}],{duration:700+Math.random()*300,easing:'cubic-bezier(.2,.7,.2,1)'}).onfinish=()=>p.remove();}
}
document.getElementById('reset').addEventListener('click',build);
build();

/* ===== tabs (crossfade) ===== */
const tl=document.getElementById('tab-learn'),tb=document.getElementById('tab-build'),vl=document.getElementById('view-learn'),vb=document.getElementById('view-build');
function show(which){const toL=which==='learn';tl.classList.toggle('on',toL);tb.classList.toggle('on',!toL);
  const showEl=toL?vl:vb,hideEl=toL?vb:vl;hideEl.classList.add('hide');showEl.classList.remove('hide');showEl.style.animation='none';void showEl.offsetWidth;showEl.style.animation='';}
tl.addEventListener('click',()=>show('learn'));tb.addEventListener('click',()=>show('build'));
</script>
